[package]
name = "mcpg-plugin-credential-oauth-client-credentials"
version = "0.1.0-alpha.19"
license = "Apache-2.0"
edition = "2024"
description = "OAuth 2.0 client_credentials credential_issuer plugin for MCPG (RFC 6749 §4.4)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dashmap = "6"
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's `declare_credential_issuer_plugin!`
# `build_static` accessor (gated `#[cfg(feature = "static-firstparty")]`)
# does not trigger `unexpected_cfgs` in consumer compilation. Empty:
# this plugin is consumed as a cdylib, not via the static-firstparty
# fast path.
static-firstparty = []
